# MANJIRO DINAMIC — base configuration (v1.7.1 — SD870/Kona CALIBRADO)
# Calibrado contra dump real do device: Motorola Edge 20 Pro / Lineage 23.2 /
# kernel 4.19.325-cip131-st15-perf / SM8250 / Adreno 650 / LPDDR5.
# Unidade interna: c10 = décimos de °C (ex.: 850 = 85.0°C).
LOG_ENABLE=1

# ── Engine toggle ────────────────────────────────────────────────────────────
ENGINE_MODE=advanced

# ── SoC ceilings ────────────────────────────────────────────────────────────
# Calibração: o thermal-engine do vendor da Lineage faz throttling de CPU7
# (Prime) com sensor BACK_TEMP em 7 níveis:
#   37.5°C → cap 2457.6 MHz   |   42.0°C → cap 1747.2 MHz
#   39.0°C → cap 2265.6 MHz   |   43.5°C → cap 1401.6 MHz
#   40.0°C → cap 1977.6 MHz   |   45.5°C → cap 1190.4 MHz
#   41.0°C → cap 1862.4 MHz
# Nosso teto Manjiro fica abaixo do vendor (85°C die-temp = ~45°C back). Não
# brigamos, complementamos: cortamos micro-ajustes antes do vendor stepar.
SOC_TARGET_C10=800
SOC_HARD_LIMIT_C10=850
SOC_CRITICAL_C10=900
THERMAL_TARGET_C10=800
THERMAL_HARD_LIMIT_C10=850
TEMP_CRITICAL_C10=900

# Zones (sense.sh, control.sh)
ZONE_FREE_C10=750
ZONE_NORMAL_C10=800
ZONE_SOFT_C10=830
ZONE_HARD_C10=850
ZONE_CRITICAL_C10=900

# ── Battery ─────────────────────────────────────────────────────────────────
BATTERY_EMERGENCY_C10=450
BATTERY_TEMP_CRITICAL_C10=450
BATTERY_WARNING_C10=420

# ── PID ─────────────────────────────────────────────────────────────────────
PID_TARGET_C10=800
PID_KP=2
PID_KI=1
PID_KD=5
I_MAX=300

# ── Loop intervals ──────────────────────────────────────────────────────────
LOOP_ACTIVE_SEC=15
LOOP_GAME_SEC=3
LOOP_SCREENOFF_SEC=45
LOOP_IDLE_SEC=30
LOOP_DOZE_SEC=60
COOLDOWN_SEC=30

# Event-driven
EVENT_DRIVEN=1
EVENT_IDLE_DEADLINE_SEC=30

# Helper / bridge
HELPER_HEARTBEAT_SEC=15
HELPER_TIMEOUT_SEC=60
BRIDGE_INTERVAL=8

# Actuation budget
ACTUATION_BUDGET_PER_MIN=20
SAFE_MODE_FAIL_LIMIT=5

# ── Features ────────────────────────────────────────────────────────────────
UCLAMP_ENABLE=1
PSI_ENABLE=1
KGSL_ENABLE=1
KGSL_TARGET_LOAD_ENABLE=1
DEVFREQ_ENABLE=1
EAS_ENABLE=1
VM_GAME_GUARD=1
GAME_CPUSET_ENABLE=1
GAME_RENICE_ENABLE=1
SCHEDUTIL_ENABLE=1
DISABLE_TOUCHBOOST=1
DISABLE_SCHEDTUNE_BOOST=1
GAME_BUS_PERF=1

# ── schedutil (µs) ──────────────────────────────────────────────────────────
# Lineage perf default mediu no device: up=12000 / down=40000.
# Em jogo agressivo: subida rápida (4000) e descida moderada (20000).
# Em IDLE: subida lenta (15000) e descida rápida (8000) — economiza bateria.
SCHEDUTIL_UP_US=12000
SCHEDUTIL_DOWN_US=40000
SCHEDUTIL_GAME_UP_US=4000
SCHEDUTIL_GAME_DOWN_US=20000
SCHEDUTIL_SCREENOFF_UP_US=15000
SCHEDUTIL_SCREENOFF_DOWN_US=8000
SCHEDUTIL_IDLE_UP_US=15000
SCHEDUTIL_IDLE_DOWN_US=8000

# Schedutil extras (Kona qcom patches medidos no device):
# hispeed_load: 90 default → 80 em jogo (subida mais agressiva)
# hispeed_freq: medidos 1248/1574/1632 MHz por cluster
# pl: 1 (predictive load on) já default da Lineage
SCHEDUTIL_GAME_HISPEED_LOAD=80
SCHEDUTIL_IDLE_HISPEED_LOAD=92
SCHEDUTIL_GAME_HISPEED_POL0=1612800
SCHEDUTIL_GAME_HISPEED_POL4=2150400
SCHEDUTIL_GAME_HISPEED_POL7=2649600

# ── uclamp active ───────────────────────────────────────────────────────────
UCLAMP_BG_MAX=15
UCLAMP_SYSBG_MAX=30
UCLAMP_FG_MAX=70
UCLAMP_TOP_MIN=0
UCLAMP_TOP_MAX=100

# ── uclamp game ─────────────────────────────────────────────────────────────
UCLAMP_GAME_BG_MAX=10
UCLAMP_GAME_SYSBG_MAX=20
UCLAMP_GAME_FG_MAX=80
UCLAMP_GAME_TOP_MIN=8
UCLAMP_GAME_TOP_MAX=100
UCLAMP_BG_CLAMPED=5

# ── uclamp IDLE/powersave ────────────────────────────────────────────────────
# Em IDLE/tela apagada queremos uclamp mais apertado para conservar bateria.
UCLAMP_IDLE_BG_MAX=10
UCLAMP_IDLE_SYSBG_MAX=15
UCLAMP_IDLE_FG_MAX=60
UCLAMP_IDLE_TOP_MIN=0
UCLAMP_IDLE_TOP_MAX=85

# ── EAS active (valores Lineage atuais: up=9295 down=7585) ──────────────────
# Mantemos compatibilidade com a base já tunada da Lineage perf.
EAS_UPMIGRATE=92
EAS_DOWNMIGRATE=75

# ── EAS game ────────────────────────────────────────────────────────────────
EAS_GAME_UPMIGRATE=82
EAS_GAME_DOWNMIGRATE=62

# ── EAS IDLE/power-save ─────────────────────────────────────────────────────
# Forçar tarefas a ficarem nos cores Little em IDLE.
EAS_IDLE_UPMIGRATE=98
EAS_IDLE_DOWNMIGRATE=80

# ── KGSL (Adreno 650 — confirmado: 7 pwrlevels [0..6], 670→305 MHz) ─────────
# pwrlevels (idx → MHz):
#   0 = 670.0 MHz (max)        4 = 441.6 MHz
#   1 = 587.0 MHz              5 = 400.0 MHz
#   2 = 525.0 MHz              6 = 305.0 MHz (default + min)
#   3 = 490.0 MHz
# default_pwrlevel = 6 (min), max_pwrlevel = 0, thermal_pwrlevel = 0
# Governor atual: msm-adreno-tz | polling_interval: 10ms | idle_timer: 80ms
KGSL_TARGET_LOAD=65
KGSL_GAME_TARGET_LOAD=50
KGSL_SCREENOFF_TARGET_LOAD=80
KGSL_IDLE_TIMER_GAME=120
KGSL_IDLE_TIMER_IDLE=300

# GPU pwrlevel mínimo desejado em jogo (1=587 MHz, 2=525 MHz; nunca 0=clock-locked)
KGSL_GAME_MIN_PWRLEVEL=2

# ── VM ──────────────────────────────────────────────────────────────────────
VM_SWAPPINESS_GAME=0
VM_WATERMARK_GAME=200
VM_SWAPPINESS_IDLE=80
VM_WATERMARK_IDLE=100

# ── PSI thresholds ──────────────────────────────────────────────────────────
CPU_PSI_HIGH_CPCT=60
MEM_PSI_HIGH_CPCT=2500
IO_PSI_HIGH_CPCT=2500
GPU_BUSY_LOW=62
GPU_BUSY_HIGH=88

# ── Floor caps ──────────────────────────────────────────────────────────────
PID_MIN_GPU_PCT=72
PID_MIN_CPU_PCT=78

# ── Cost-function weights ───────────────────────────────────────────────────
W_THERMAL=30
W_LATENCY=25
W_PRESSURE=20
W_POWER=10
W_CHANGE=10
W_STABLE=5

LYAPUNOV_MARGIN=50
LYAPUNOV_OSC_LIMIT=8

# MPC
MPC_HORIZON_SEC=5
MPC_LOOKBACK_SAMPLES=8
EMA_ALPHA_INV_TEMP=4
EMA_ALPHA_INV_GPU=4
EMA_ALPHA_INV_CURRENT=6
EMA_ALPHA_INV_PSI=3
CUSUM_THRESHOLD_TEMP=300
CUSUM_THRESHOLD_GPU=2000

# ── WebUI ───────────────────────────────────────────────────────────────────
WEBUI_PORT=8080

# ════════════════════════════════════════════════════════════════════════════
# v1.7.0 — atuadores SD870/Kona (engenharia reversa)
# ════════════════════════════════════════════════════════════════════════════
IO_SCHED_ENABLE=1
IO_QUEUE_TUNE=1
HWUI_HINTS_ENABLE=1
KGSL_TUNE_ENABLE=1
KGSL_GAME_ADRENOBOOST=2
TOUCHPANEL_GAME_ENABLE=1
TCP_GAME_ENABLE=1
SCHED_LIB_ENABLE=1
KONA_BUS_FLOOR_ENABLE=1
CORE_CTL_GAME_ENABLE=1
SCHED_KONA_ENABLE=1
CPUSET_EXT_ENABLE=1
THREAD_PIN_GAME_ENABLE=1
THREAD_PIN_MASK=f0
VMTOUCH_GAME_ENABLE=0
TOAST_ENABLE=0

# ════════════════════════════════════════════════════════════════════════════
# v1.7.1 — calibração + economia de bateria SD870/Kona
# ════════════════════════════════════════════════════════════════════════════

# ── L3 cache (cpu0/4/7-l3-lat) ──────────────────────────────────────────────
# 14 níveis confirmados (MHz): 300 403.2 518.4 614.4 729.6 825.6 921.6 1017.6
#                              1132.8 1228.8 1324.8 1420.8 1516.8 1612.8
# Governor atual: mem_latency | medido em 1516.8 MHz no idle
L3_FLOOR_GAME_HZ=614400000       # nível 4/14 (compromisso latência/energia)
L3_FLOOR_IDLE_HZ=403200000       # nível 2/14 — relax para economizar
L3_PATHS="/sys/class/devfreq/18590000.qcom,devfreq-l3:qcom,cpu0-cpu-l3-lat /sys/class/devfreq/18590000.qcom,devfreq-l3:qcom,cpu4-cpu-l3-lat /sys/class/devfreq/18590000.qcom,devfreq-l3:qcom,cpu7-cpu-l3-lat"

# ── DDR bandwidth (LPDDR5 — 11 steps em MB/s) ───────────────────────────────
# Steps: 762 1144 1720 2086 2597 2929 3879 5931 6881 7980 10437
# Governor: bw_hwmon | atual: 3879 MB/s
DDR_FLOOR_GAME_BW=3879           # step 7/11 (preserva fluidez)
DDR_FLOOR_IDLE_BW=762            # step 1/11 (sleep deep)
DDR_PATH="/sys/class/devfreq/soc:qcom,cpu-llcc-ddr-bw"

# LLCC (cache L4)
LLCC_PATH="/sys/class/devfreq/soc:qcom,cpu-cpu-llcc-bw"

# ── GPU pwrlevel control (preferred over %-based capping) ───────────────────
# thermal_pwrlevel: cap explícito em índice 0..6. 0=670MHz, 6=305MHz
# Em jogo deixamos thermal_pwrlevel=0 (livre) e atuamos via target_load
# Em IDLE forçamos thermal_pwrlevel=4 (441.6 MHz max) — economiza bateria sem
# travar UI fluida porque o GPU governor sobe quando precisa.
KGSL_THERMAL_PWRLEVEL_IDLE=4
KGSL_THERMAL_PWRLEVEL_GAME=0

# ── Touchpanel detection (motor probe — confirma path real) ─────────────────
# Edge 20 Pro usa FocalTech "fts" em event9. /proc/touchpanel/ NÃO existe.
# Probe ordem: /proc/touchpanel /sys/touchscreen /sys/class/touch_dev
#              /sys/class/touchpanel /sys/devices/virtual/touchscreen/*
TOUCHPANEL_PROBE_ENABLE=1

# ── sched_lib_name: MERGE não overwrite ─────────────────────────────────────
# Lineage perf já seta "UnityMain,libunity.so". Manjiro vai APPEND a essa
# lista em vez de sobrescrever, e fazer backup do valor original.
SCHED_LIB_MERGE=1

# ── PMIC charging thermal management (Motorola pstar) ───────────────────────
# Edge 20 Pro tem mmi_chrg_manager (Motorola parallel charger) + BQ2597X.
# Em jogo: se SoC > 80% AND temp_bat > 40°C, downgrade Parallel→Single
# Em IDLE: charging power normal (deixa o vendor decidir)
CHARGE_THERMAL_MANAGE=1
CHARGE_GAME_SOC_THRESHOLD=80
CHARGE_GAME_TEMP_THRESHOLD_C10=400
CHARGE_BYPASS_FULL_THRESHOLD=95   # acima disso, motor sugere desconectar

# ── Powersave actuators (NOVOS — economia sem perder desempenho) ────────────
# Estes atuadores rodam APENAS em IDLE e ACTIVE de tela apagada / bateria baixa
POWERSAVE_ENABLE=1

# Cap dos clusters em IDLE com tela apagada (% do max teórico)
# Little: 70% = 1.26 GHz (suficiente para wakelocks, notif, alarmes)
# Gold:   50% = 1.21 GHz (descansa)
# Prime:  40% = 1.27 GHz (descansa pesado — vendor já throttlou aliás)
POWERSAVE_LITTLE_PCT=70
POWERSAVE_GOLD_PCT=50
POWERSAVE_PRIME_PCT=40
POWERSAVE_GPU_PCT=50

# Battery saver — quando bateria < 20% AND descarregando, modo extra-econômico
BATSAVER_THRESHOLD_PCT=20
BATSAVER_LITTLE_PCT=60
BATSAVER_GOLD_PCT=40
BATSAVER_PRIME_PCT=30
BATSAVER_GPU_PCT=40

# Doze-aware: ao detectar device_idle (Android Doze), motor aumenta loop
# interval para 60s e dropa tudo para o piso. Acordamos no próximo evento.
DOZE_AWARE_ENABLE=1
