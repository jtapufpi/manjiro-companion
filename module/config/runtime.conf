# MANJIRO DINAMIC — base configuration (v1.6.2-fixes)
# Internal unit: c10 = tenths of °C (e.g. 850 = 85.0°C).
LOG_ENABLE=1

# ── Engine toggle ────────────────────────────────────────────────────────────
# advanced = use sense.sh + control.sh (cost/CBF/Lyapunov/Pareto/pkg-history).
# legacy   = old policy.sh selector only (kept for fallback).
ENGINE_MODE=advanced

# ── SoC ceilings (TACTICAL — drives the entire control loop) ─────────────────
# Snapdragon 870 thermal_zone* die-temp. Free → Normal → Soft → Hard → Critical.
# We let the chip "suar" up to 80°C, soft-clamp at 83°C, hard-clamp at 85°C.
SOC_TARGET_C10=800
SOC_HARD_LIMIT_C10=850
SOC_CRITICAL_C10=900
THERMAL_TARGET_C10=800
THERMAL_HARD_LIMIT_C10=850
TEMP_CRITICAL_C10=900

# Thermal zones (used by scripts/thermal.sh, scripts/control.sh)
ZONE_FREE_C10=750
ZONE_NORMAL_C10=800
ZONE_SOFT_C10=830
ZONE_HARD_C10=850
ZONE_CRITICAL_C10=900

# ── Battery (EMERGENCY-ONLY — never drives tactical decisions) ───────────────
# Above this, daemon enters SAFE and rolls back everything.
BATTERY_EMERGENCY_C10=450
BATTERY_TEMP_CRITICAL_C10=450
# Soft warning (logged but no rollback) — for the WebUI badge.
BATTERY_WARNING_C10=420

# ── PID (SoC-driven) ─────────────────────────────────────────────────────────
PID_TARGET_C10=800
PID_KP=2
PID_KI=1
PID_KD=5
I_MAX=300

# ── Loop intervals (seconds) — fallback when no event arrives ────────────────
LOOP_ACTIVE_SEC=15
LOOP_GAME_SEC=3
LOOP_SCREENOFF_SEC=45
LOOP_IDLE_SEC=30
COOLDOWN_SEC=30

# ── Event-driven listener ────────────────────────────────────────────────────
# 1 = wait on inotify (event-driven, default). 0 = legacy polling.
EVENT_DRIVEN=1
# Idle deadline before re-polling sensors even without an event.
EVENT_IDLE_DEADLINE_SEC=30

# ── Helper / bridge ──────────────────────────────────────────────────────────
HELPER_HEARTBEAT_SEC=15
HELPER_TIMEOUT_SEC=60
BRIDGE_INTERVAL=8

# ── Actuation budget per minute ──────────────────────────────────────────────
ACTUATION_BUDGET_PER_MIN=20
SAFE_MODE_FAIL_LIMIT=5

# ── Features ─────────────────────────────────────────────────────────────────
UCLAMP_ENABLE=1
PSI_ENABLE=1
KGSL_ENABLE=1
KGSL_TARGET_LOAD_ENABLE=1
DEVFREQ_ENABLE=1
EAS_ENABLE=1
VM_GAME_GUARD=1
GAME_CPUSET_ENABLE=1
GAME_RENICE_ENABLE=1
SCHEDUTIL_ENABLE=1
DISABLE_TOUCHBOOST=1
DISABLE_SCHEDTUNE_BOOST=1
GAME_BUS_PERF=1

# ── schedutil (microseconds) ─────────────────────────────────────────────────
SCHEDUTIL_UP_US=2000
SCHEDUTIL_DOWN_US=4000
SCHEDUTIL_GAME_UP_US=1000
SCHEDUTIL_GAME_DOWN_US=10000
SCHEDUTIL_SCREENOFF_UP_US=12000
SCHEDUTIL_SCREENOFF_DOWN_US=40000

# ── uclamp active ────────────────────────────────────────────────────────────
UCLAMP_BG_MAX=15
UCLAMP_SYSBG_MAX=30
UCLAMP_FG_MAX=70
UCLAMP_TOP_MIN=0
UCLAMP_TOP_MAX=100

# ── uclamp game ──────────────────────────────────────────────────────────────
UCLAMP_GAME_BG_MAX=10
UCLAMP_GAME_SYSBG_MAX=20
UCLAMP_GAME_FG_MAX=80
UCLAMP_GAME_TOP_MIN=8
UCLAMP_GAME_TOP_MAX=100
UCLAMP_BG_CLAMPED=5

# ── EAS active ───────────────────────────────────────────────────────────────
EAS_UPMIGRATE=92
EAS_DOWNMIGRATE=75

# ── EAS game ─────────────────────────────────────────────────────────────────
EAS_GAME_UPMIGRATE=82
EAS_GAME_DOWNMIGRATE=62

# ── KGSL (Adreno 650 on SD870) ───────────────────────────────────────────────
KGSL_TARGET_LOAD=65
KGSL_GAME_TARGET_LOAD=50
KGSL_SCREENOFF_TARGET_LOAD=80
KGSL_IDLE_TIMER_GAME=120

# ── VM game guard (12GB LPDDR5 on Edge 20 Pro) ───────────────────────────────
VM_SWAPPINESS_GAME=0
VM_WATERMARK_GAME=200

# ── PSI thresholds (centipercent — 100 = 1.00 %) ────────────────────────────
CPU_PSI_HIGH_CPCT=60
MEM_PSI_HIGH_CPCT=2500
IO_PSI_HIGH_CPCT=2500
GPU_BUSY_LOW=62
GPU_BUSY_HIGH=88

# ── Floor caps (never throttle below these) ──────────────────────────────────
PID_MIN_GPU_PCT=72
PID_MIN_CPU_PCT=78

# ── Control engine (cost-function weights) ───────────────────────────────────
# Cost = Wt*thermal + Wl*latency + Wp*pressure + Wd*power + Wc*change + Ws*osc
W_THERMAL=30
W_LATENCY=25
W_PRESSURE=20
W_POWER=10
W_CHANGE=10
W_STABLE=5

# Lyapunov / oscillation tolerance
LYAPUNOV_MARGIN=50
LYAPUNOV_OSC_LIMIT=8

# MPC (sense.sh)
MPC_HORIZON_SEC=5
MPC_LOOKBACK_SAMPLES=8
EMA_ALPHA_INV_TEMP=4
EMA_ALPHA_INV_GPU=4
EMA_ALPHA_INV_CURRENT=6
EMA_ALPHA_INV_PSI=3
CUSUM_THRESHOLD_TEMP=300
CUSUM_THRESHOLD_GPU=2000

# ── WebUI ────────────────────────────────────────────────────────────────────
WEBUI_PORT=8080
